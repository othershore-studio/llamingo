name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

  # Proves the desktop app builds on a clean machine and uploads the Windows
  # .exe as an artifact. wails build runs the web build itself (see wails.json).
  # macOS / Linux jobs slot into this same file when wanted — they just build on
  # their own runner (Wails can't cross-compile the native webview).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build the desktop app
        run: wails build
      - uses: actions/upload-artifact@v4
        with:
          name: llamingo-windows
          path: build/bin/llamingo.exe
          if-no-files-found: error
