# Builds the Windows desktop release (Wails) and attaches it to the GitHub Release.
#
# Runs only when you ask for it — on a version tag (`git tag v0.1.0 && git push
# --tags`), which also attaches the zip to the matching GitHub Release, or via the
# "Run workflow" button (Actions tab). Nothing runs on ordinary pushes — the
# per-push desktop/web build-check lives in ci.yml.
#
# The build is UNSIGNED (Windows SmartScreen shows "unknown publisher" on download) —
# desktop needs no secrets. An Authenticode signing step can slot in after the build
# later, once a code-signing certificate exists.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # Needed so a tagged run can attach the zip to the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pin Go to the toolchain go.mod declares, so CI matches the dev machine.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Wails pinned to the version required in go.mod.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      # `wails build` runs the web build itself (see wails.json) -> build/bin/llamingo.exe.
      - name: Build the desktop app
        run: wails build

      # Wails produces a single self-contained .exe (WebView2 comes from the OS).
      - name: Package the build
        run: >-
          Compress-Archive
          -Path build\bin\llamingo.exe
          -DestinationPath llamingo-windows-amd64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamingo-windows-amd64
          path: llamingo-windows-amd64.zip
          if-no-files-found: error

      # On a version tag, also attach the zip to that tag's GitHub Release
      # (created if it doesn't exist yet).
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: llamingo-windows-amd64.zip
